[package]
name = "daw-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[dev-dependencies]
# Test-only: the native export reference (tests/export_render.rs) computes its
# math with the same libm the wasm std uses (compiler-builtins), so native and
# engine.wasm renders are bit-identical. Keep the version equal to the
# toolchain's library/compiler-builtins/libm.
libm = { version = "=0.2.16", default-features = false }
